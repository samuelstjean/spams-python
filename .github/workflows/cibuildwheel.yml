name: Build and upload to PyPI

# Build on every branch push, tag push, and pull request change:
# on: [push, pull_request]
# Alternatively, to publish when a (published) GitHub Release is created, use the following:
on:
  pull_request:
      branches:
        - master
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.pyver }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        pyver: ['cp310', 'cp311', 'cp312', 'cp313', 'cp314', 'cp315']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Miniconda
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: openblas
          auto-activate-base: false
          channels: conda-forge
          conda-remove-defaults: true

      - name: Mac os deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "${{matrix.pyver}}-*"

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.10'

      - name: Test against oldest supported numpy version
        if: ${{ matrix.pyver == 'cp310' }}
        shell: bash
        run: |
            python -m pip install ./wheelhouse/*${{matrix.pyver}}*.whl
            python -m pip install numpy==1.21.3 scipy==1.8 pillow==9.0 pytest
            pytest .

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-${{ matrix.pyver }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          sudo apt install libopenblas-dev
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  merge:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: artifacts
          pattern: cibw-*

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # upload to PyPI on every tag starting with 'v'
    # if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
